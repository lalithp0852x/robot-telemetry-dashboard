<!doctype html><html><head><meta charset="utf-8"><title>Expense Tracker</title><style>body{font:16px system-ui;max-width:700px;margin:40px auto;background:#f5f7fa;color:#17202a;padding:20px}.card{background:white;padding:24px;border-radius:12px;box-shadow:0 5px 20px #dfe5eb}input,button{padding:10px;margin:4px;border:1px solid #ccd5df;border-radius:5px}button{background:#2563eb;color:white}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}</style></head><body><div class="card"><h1>Expense Tracker</h1><p>Total: <b id="total">₹0</b></p><input id="name" placeholder="Expense name"><input id="amount" type="number" placeholder="Amount"><button onclick="add()">Add expense</button><div id="list"></div></div><script>let total=0;function add(){let n=document.querySelector('#name'),a=document.querySelector('#amount'),v=Number(a.value);if(!n.value||!v)return;total+=v;document.querySelector('#total').textContent='₹'+total;document.querySelector('#list').innerHTML+=`<div class="row"><span>${n.value}</span><span>₹${v}</span></div>`;n.value='';a.value=''}</script></body></html>
