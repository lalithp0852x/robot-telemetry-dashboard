<!doctype html><html><head><meta charset="utf-8"><title>Markdown Notes</title><style>body{font:16px system-ui;display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:900px;margin:40px auto}textarea,article{min-height:400px;padding:18px;border:1px solid #ccd5df;border-radius:8px}article{background:#fafafa}h1{color:#2563eb}code{background:#e8eef5;padding:2px 4px}</style></head><body><textarea id="src"># My Notes &#10;Write **Markdown** here.&#10;- Fast preview&#10;- No backend required</textarea><article id="out"></article><script>function render(s){return s.replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/`(.*?)`/g,'<code>$1</code>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\n/g,'<br>')}let s=document.querySelector('#src'),o=document.querySelector('#out');function update(){o.innerHTML=render(s.value)}s.addEventListener('input',update);update()</script></body></html>
