<!doctype html><html><head><meta charset="utf-8"><title>Realtime Chat Demo</title><style>body{font:16px system-ui;max-width:620px;margin:50px auto;background:#101820;color:#eef;padding:20px}.box{background:#182631;padding:22px;border-radius:10px}.messages{height:300px;overflow:auto;border:1px solid #38505c;padding:12px;margin-bottom:12px}.msg{padding:8px;border-bottom:1px solid #2b3e47}input,button{padding:11px;border-radius:5px;border:0}input{width:75%}button{background:#7df0a3;cursor:pointer}</style></head><body><h1>Realtime Chat Demo</h1><div class="box"><div class="messages" id="messages"><div class="msg">System: demo connected</div></div><input id="input" placeholder="Type a message"><button onclick="send()">Send</button></div><script>function send(){let i=document.querySelector('#input');if(!i.value.trim())return;let m=document.querySelector('#messages');m.innerHTML+=`<div class="msg"><b>You:</b> ${i.value}</div>`;i.value='';m.scrollTop=m.scrollHeight}document.querySelector('#input').addEventListener('keydown',e=>{if(e.key==='Enter')send()})</script></body></html>
