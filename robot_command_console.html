<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Command Console</title>
<style>body{margin:0;background:#0b1114;color:#e7f0ee;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(760px,90vw)}.eyebrow{color:#92f5b0;font:12px monospace;letter-spacing:.15em}h1{font-size:38px;margin:8px 0 30px}.console{background:#111a1e;border:1px solid #2b4046;border-radius:8px;padding:24px}.readout{font:24px monospace;color:#6bd8ef;margin-bottom:22px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:auto}.pad button{background:#18262b;border:1px solid #385058;color:#e7f0ee;border-radius:5px;padding:18px;font-size:20px;cursor:pointer}.pad button:hover{border-color:#92f5b0;color:#92f5b0}.log{border-top:1px solid #2b4046;margin-top:25px;padding-top:15px;color:#829398;font:12px monospace;line-height:1.8}</style></head>
<body><div class="wrap"><div class="eyebrow">ROVER·01 / COMMAND INTERFACE</div><h1>Robot Command Console</h1><div class="console"><div class="readout" id="readout">READY · Awaiting command</div><div class="pad"><span></span><button data-cmd="FORWARD">↑</button><span></span><button data-cmd="LEFT">←</button><button data-cmd="STOP">■</button><button data-cmd="RIGHT">→</button><span></span><button data-cmd="REVERSE">↓</button><span></span></div><div class="log" id="log">[local] Command channel initialized<br>[local] Simulation mode enabled</div></div></div>
<script>const out=document.querySelector('#readout'),log=document.querySelector('#log');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const c=b.dataset.cmd;out.textContent=`SENT · ${c}`;log.innerHTML+=`<br>[${new Date().toLocaleTimeString()}] TX command=${c}`;});</script></body></html>
